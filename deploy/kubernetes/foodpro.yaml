apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodpro-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: foodpro-api
  template:
    metadata:
      labels:
        app: foodpro-api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: foodpro
          image: ghcr.io/webtranz/food-pro:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: foodpro-config
            - secretRef:
                name: foodpro-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: foodpro-api
spec:
  selector:
    app: foodpro-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodpro-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodpro-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foodpro-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: foodpro-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foodpro-config
data:
  NODE_ENV: production
  PORT: "3000"
  HOST: 0.0.0.0
  DB_POOL_MAX: "20"
  DB_POOL_IDLE_TIMEOUT_MS: "30000"
  DB_POOL_CONNECTION_TIMEOUT_MS: "5000"
  DB_POOL_MAX_LIFETIME_SECONDS: "1800"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_QUERY_TIMEOUT_MS: "20000"
  SITE_SCOPE_CACHE_TTL_MS: "10000"
  ROLE_PROFILE_CACHE_TTL_MS: "10000"
  COSTING_CATALOG_CACHE_TTL_MS: "10000"
  BULK_UPLOAD_WORKERS: "1"
  BULK_UPLOAD_QUEUE_POLL_MS: "2000"
  BULK_UPLOAD_STALE_AFTER_MS: "900000"
  OBJECT_STORAGE_BUCKET: foodpro
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
