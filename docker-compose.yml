services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodpro}
      POSTGRES_USER: ${POSTGRES_USER:-foodpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodpro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  foodpro:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      DATABASE_INIT_ATTEMPTS: ${DATABASE_INIT_ATTEMPTS:-30}
      DATABASE_INIT_DELAY_MS: ${DATABASE_INIT_DELAY_MS:-2000}
      GENERAL_UPLOAD_MAX_MB: ${GENERAL_UPLOAD_MAX_MB:-25}
      BULK_UPLOAD_MAX_MB: ${BULK_UPLOAD_MAX_MB:-25}
      BULK_UPLOAD_BATCH_SIZE: ${BULK_UPLOAD_BATCH_SIZE:-500}
      BULK_UPLOAD_WORKERS: ${BULK_UPLOAD_WORKERS:-1}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://foodpro.example.com}
      DATABASE_URL: ${DATABASE_URL:-postgresql://foodpro:foodpro@postgres:5432/foodpro}
      REALTIME_DATABASE_URL: ${REALTIME_DATABASE_URL:-postgresql://foodpro:foodpro@postgres:5432/foodpro}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-foodpro}
      POSTGRES_USER: ${POSTGRES_USER:-foodpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodpro}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      DB_APPLICATION_NAME: ${DB_APPLICATION_NAME:-foodpro-api}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-20000}
      SITE_SCOPE_CACHE_TTL_MS: ${SITE_SCOPE_CACHE_TTL_MS:-10000}
      ROLE_PROFILE_CACHE_TTL_MS: ${ROLE_PROFILE_CACHE_TTL_MS:-10000}
      COSTING_CATALOG_CACHE_TTL_MS: ${COSTING_CATALOG_CACHE_TTL_MS:-10000}
      BULK_UPLOAD_QUEUE_POLL_MS: ${BULK_UPLOAD_QUEUE_POLL_MS:-2000}
      BULK_UPLOAD_STALE_AFTER_MS: ${BULK_UPLOAD_STALE_AFTER_MS:-900000}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-foodpro}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_SESSION_TOKEN: ${OBJECT_STORAGE_SESSION_TOKEN:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Humayun Khizar}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-humayoonkhizar12@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Tafga@2030}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
