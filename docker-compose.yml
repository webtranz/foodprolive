services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodpro}
      POSTGRES_USER: ${POSTGRES_USER:-foodpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodpro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  foodpro:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
